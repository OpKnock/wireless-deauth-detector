[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-deauth-detector"
version = "0.1.0"
description = "802.11 deauth flood detection (educational, offline)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["deauthscan"]
